version: '3.8'

services:
  recommender:
    build:
      context: .
      dockerfile: services/recommender/Dockerfile
    container_name: bharat-recommender
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./shared:/app/shared:ro
    env_file:
      - .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
      - USE_MOCK_LLM=${USE_MOCK_LLM:-auto}
      - DATA_DIR=${DATA_DIR:-/app/data}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONPATH=/app
    networks:
      - bharat-net
    restart: unless-stopped

  chatbot:
    build:
      context: .
      dockerfile: services/chatbot/Dockerfile
    container_name: bharat-chatbot
    ports:
      - "8002:8002"
    volumes:
      - ./data:/app/data:ro
      - ./shared:/app/shared:ro
    env_file:
      - .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
      - USE_MOCK_LLM=${USE_MOCK_LLM:-auto}
      - DATA_DIR=${DATA_DIR:-/app/data}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONPATH=/app
    networks:
      - bharat-net
    restart: unless-stopped

  early_warning:
    build:
      context: .
      dockerfile: services/early_warning/Dockerfile
    container_name: bharat-early-warning
    ports:
      - "8003:8003"
    volumes:
      - ./data:/app/data
      - ./shared:/app/shared:ro
    env_file:
      - .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
      - USE_MOCK_LLM=${USE_MOCK_LLM:-auto}
      - DATA_DIR=${DATA_DIR:-/app/data}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONPATH=/app
    networks:
      - bharat-net
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    container_name: bharat-orchestrator
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./shared:/app/shared:ro
    env_file:
      - .env
    environment:
      - USE_LOCAL_SERVICES=false
      - RECOMMENDER_URL=http://recommender:8001
      - CHATBOT_URL=http://chatbot:8002
      - EARLY_WARNING_URL=http://early_warning:8003
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
      - USE_MOCK_LLM=${USE_MOCK_LLM:-auto}
      - DATA_DIR=${DATA_DIR:-/app/data}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONPATH=/app
    depends_on:
      - recommender
      - chatbot
      - early_warning
    networks:
      - bharat-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: bharat-frontend
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
    env_file:
      - .env
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8000
      - DATA_DIR=/app/data
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - orchestrator
    networks:
      - bharat-net
    restart: unless-stopped

networks:
  bharat-net:
    driver: bridge
